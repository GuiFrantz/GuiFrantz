<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gui Frantz</title>
    <link rel="stylesheet" href="styles.css">
    <script src="config.js" defer></script>
    <script src="render.js" defer></script>
</head>
<body>
    <div class="page">
        <header class="section">
            <div class="row name-row">
                <h1 id="name"></h1>
                <div class="row links" id="socials"></div>
            </div>
            <h2 id="title"></h2>
            <p class="muted" id="location"></p>
        </header>

        <section class="section">
            <h3>Experience</h3>
            <div id="experience"></div>
        </section>

        <section class="section">
            <h3>Projects</h3>
            <div id="projects"></div>
        </section>

        <section class="section">
            <h3>Education</h3>
            <div id="education"></div>
        </section>

        <footer class="footer">
            <p><span id="footerName"></span> &copy; <span id="footerYear"></span></p>
        </footer>
    </div>
</body>
</html>
